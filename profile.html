<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
<div class="profile-container">
    <h1 class="h1-profile">PROFILE</h1>

    <img src="" alt="Avatar" id="avatar">

    <input type="text" placeholder="Enter your username" >

    <h2>Note: Select your favorite avatar before proceed</h2>
    <button onclick="setAvatar('avatar/1.jpeg')">
        <img src="avatar/1.jpeg" alt="">
    </button>

    <button onclick="setAvatar('avatar/2.jpeg')">
        <img src="avatar/2.jpeg" alt="">
    </button>

    <button onclick="setAvatar('avatar/3.jpeg')">
        <img src="avatar/3.jpeg" alt="">
    </button>

    <button onclick="setAvatar('avatar/4.jpeg')">
        <img src="avatar/4.jpeg" alt="">
    </button>

    <div class="btn-next-container">
        <button class="btn-next" onclick="showModal()">NEXT</button>
    </div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <h2 id="greetText"></h2>
        <button onclick="closeModal()">OK</button>
    </div>
</div>
</body>
<script>
let selectedAvatar = "";

function setAvatar(imagePath) {
    const avatar = document.getElementById("avatar");

    avatar.src = imagePath;
    avatar.style.display = "block";

    selectedAvatar = imagePath; // STORE kung may napili
}

function showModal() {
    const name = document.querySelector("input").value;
    const greet = document.getElementById("greetText");

    // ❌ CHECK: wala pang avatar
    if (selectedAvatar === "") {
        greet.innerText = "Please select an avatar first!";
        document.getElementById("modal").style.display = "flex";
        return;
    }

    // ❌ CHECK: walang name
    if (name.trim() === "") {
        greet.innerText = "Please enter your name first!";
        document.getElementById("modal").style.display = "flex";
        return;
    }

    // ✅ SUCCESS
    greet.innerText = `Hello, ${name}! You're a nice student.`;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>
</html>
